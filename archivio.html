<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Area Riservata — Dott.ssa Chiara De Prezzo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1A2F4A;--navy-deep:#0C1E36;--blue:#1A6AC0;--blue-dark:#0C2E58;
  --blue-light:#3AABF0;--cyan:#5BAEE0;
  --accent-grad:linear-gradient(90deg,#1255A0,#3AABF0 52%,#90D8FF);
  --white:#FFFFFF;--off-white:#F7F8FB;--gray-50:#FAFBFC;--gray-100:#EDF0F5;
  --gray-200:#DDE3EC;--gray-300:#C5CEDB;--gray-400:#98A5B8;--gray-500:#6E7C91;
  --gray-600:#4A5568;--gray-800:#1E2E3E;
  --green:#059669;--red:#DC2626;--amber:#D97706;
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --ease:cubic-bezier(0.33,1,0.68,1);--radius:12px;
  --shadow:0 2px 12px rgba(12,30,54,0.06);--shadow-lg:0 8px 32px rgba(12,30,54,0.1);
}
html{scroll-behavior:smooth}
body{font-family:var(--font);color:var(--gray-600);background:var(--off-white);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.6}
a{text-decoration:none;color:inherit}
::selection{background:rgba(26,106,192,0.12)}
button{font-family:var(--font);cursor:pointer}
input,select,textarea{font-family:var(--font)}

/* Accent line */
.accent-line{height:3px;background:var(--accent-grad)}

/* ── Login ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--off-white)}
.login-card{background:var(--white);padding:48px;border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:400px;text-align:center}
.login-logo{width:56px;height:56px;border-radius:50%;margin:0 auto 16px}
.login-card h1{font-size:1.3rem;font-weight:700;color:var(--navy);margin-bottom:4px}
.login-card .sub{color:var(--gray-400);font-size:.85rem;margin-bottom:32px}
.login-field{width:100%;padding:13px 16px;border:1px solid var(--gray-200);border-radius:10px;font-size:.9rem;outline:none;background:var(--gray-50);transition:all .2s;margin-bottom:14px}
.login-field:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(26,106,192,0.06);background:var(--white)}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--blue);color:var(--white);font-size:.95rem;font-weight:600;transition:all .25s var(--ease)}
.login-btn:hover{background:var(--blue-dark);transform:translateY(-1px)}
.login-btn:disabled{opacity:.6;transform:none}
.login-error{color:var(--red);font-size:.82rem;margin-top:12px}
.login-back{display:inline-block;margin-top:20px;color:var(--gray-400);font-size:.82rem}
.login-back:hover{color:var(--blue)}

/* ── Shell ── */
.shell{display:none;min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--navy);color:var(--white);padding:0 28px;height:56px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar-left{display:flex;align-items:center;gap:12px}
.topbar-logo{width:32px;height:32px;border-radius:50%}
.topbar-title{font-size:.92rem;font-weight:600}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-user{font-size:.8rem;opacity:.6}
.topbar-btn{background:rgba(255,255,255,0.1);color:var(--white);border:none;padding:7px 16px;border-radius:8px;font-size:.8rem;transition:background .2s}
.topbar-btn:hover{background:rgba(255,255,255,0.2)}
.notif-badge{background:var(--red);color:var(--white);font-size:.65rem;font-weight:700;padding:2px 6px;border-radius:10px;margin-left:4px}

/* ── Content ── */
.content{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:24px}

/* ── Nav tabs ── */
.nav-tabs{display:flex;gap:4px;margin-bottom:24px;background:var(--white);border-radius:10px;padding:4px;box-shadow:var(--shadow);width:fit-content}
.nav-tab{padding:9px 22px;border-radius:8px;border:none;background:none;font-size:.85rem;font-weight:500;color:var(--gray-400);transition:all .2s}
.nav-tab.active{background:var(--navy);color:var(--white)}
.nav-tab:hover:not(.active){color:var(--blue)}

/* ── Cards ── */
.card{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.card-header{padding:18px 22px;border-bottom:1px solid var(--gray-100);display:flex;justify-content:space-between;align-items:center}
.card-header h2{font-size:1rem;font-weight:700;color:var(--navy)}
.card-body{padding:22px}

/* ── Stats ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat{background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);text-align:center}
.stat .num{font-size:2rem;font-weight:800;color:var(--navy);display:block}
.stat .lbl{font-size:.75rem;color:var(--gray-400);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.stat.accent .num{color:var(--blue)}

/* ── Folders grid ── */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:24px}
.folder-card{background:var(--white);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);cursor:pointer;transition:all .25s var(--ease);border:1px solid transparent;display:flex;align-items:center;gap:14px}
.folder-card:hover{border-color:var(--blue-light);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.folder-icon{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,rgba(26,106,192,0.08),rgba(58,171,240,0.08));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.folder-icon svg{width:22px;height:22px;stroke:var(--blue);fill:none;stroke-width:1.5}
.folder-name{font-weight:600;color:var(--navy);font-size:.92rem}
.folder-meta{font-size:.75rem;color:var(--gray-400);margin-top:2px}

/* ── Files table ── */
.files-table{width:100%;border-collapse:collapse}
.files-table th{text-align:left;padding:10px 16px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);background:var(--gray-50);border-bottom:1px solid var(--gray-100)}
.files-table td{padding:12px 16px;font-size:.88rem;border-bottom:1px solid var(--gray-100);color:var(--gray-600)}
.files-table tr:hover{background:var(--gray-50)}
.file-name{display:flex;align-items:center;gap:10px;font-weight:500;color:var(--navy)}
.file-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--white);flex-shrink:0}
.ext-pdf{background:#DC2626}.ext-doc{background:#2563EB}.ext-xls{background:#059669}.ext-img{background:#D97706}.ext-other{background:var(--gray-400)}

/* ── Buttons ── */
.btn{padding:9px 20px;border-radius:8px;border:none;font-size:.84rem;font-weight:600;transition:all .2s var(--ease);display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:var(--blue);color:var(--white)}
.btn-primary:hover{background:var(--blue-dark)}
.btn-ghost{background:transparent;color:var(--gray-500);border:1px solid var(--gray-200)}
.btn-ghost:hover{border-color:var(--blue);color:var(--blue)}
.btn-sm{padding:6px 14px;font-size:.78rem}
.btn-danger{background:var(--red);color:var(--white)}

/* ── Badge ── */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.badge-green{background:rgba(5,150,105,0.1);color:var(--green)}
.badge-amber{background:rgba(217,119,6,0.1);color:var(--amber)}
.badge-click{cursor:pointer;transition:all .2s}
.badge-click:hover{transform:scale(1.05);box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.badge-red{background:rgba(220,38,38,0.1);color:var(--red)}
.badge-blue{background:rgba(26,106,192,0.1);color:var(--blue)}
.badge-gray{background:rgba(110,124,145,0.1);color:var(--gray-500)}

/* ── Breadcrumb ── */
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--gray-400);margin-bottom:20px}
.breadcrumb a{color:var(--blue);font-weight:500}
.breadcrumb a:hover{text-decoration:underline}
.breadcrumb .sep{opacity:.4}

/* ── Modal ── */
.modal-overlay{position:fixed;inset:0;background:rgba(12,30,54,0.4);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal{background:var(--white);border-radius:16px;padding:32px;max-width:480px;width:100%;box-shadow:var(--shadow-lg)}
.modal h3{font-size:1.1rem;font-weight:700;color:var(--navy);margin-bottom:20px}
.modal-field{margin-bottom:16px}
.modal-field label{display:block;font-size:.72rem;font-weight:600;color:var(--gray-400);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.modal-field input,.modal-field select{width:100%;padding:11px 14px;border:1px solid var(--gray-200);border-radius:8px;font-size:.88rem;outline:none;background:var(--gray-50)}
.modal-field input:focus,.modal-field select:focus{border-color:var(--blue);background:var(--white)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}

/* ── Notifications ── */
.notif-item{padding:14px 18px;border-bottom:1px solid var(--gray-100);display:flex;gap:12px;align-items:flex-start}
.notif-item.unread{background:rgba(26,106,192,0.03)}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;margin-top:6px}
.notif-dot.read{background:var(--gray-200)}
.notif-text{flex:1;font-size:.86rem;color:var(--gray-600)}
.notif-time{font-size:.72rem;color:var(--gray-400);white-space:nowrap}

/* ── Empty state ── */
.empty{text-align:center;padding:48px 20px;color:var(--gray-400)}
.empty .icon{font-size:2.5rem;margin-bottom:12px;opacity:.4}
.empty p{font-size:.9rem}

/* ── Upload area ── */
.upload-area{border:2px dashed var(--gray-200);border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:all .2s}
.upload-area:hover{border-color:var(--blue);background:rgba(26,106,192,0.02)}
.upload-area.dragover{border-color:var(--blue);background:rgba(26,106,192,0.05)}
.upload-area input{display:none}

/* ── Responsive ── */


/* ── OnlyOffice Editor ── */
.editor-overlay{position:fixed;inset:0;background:var(--white);z-index:1000;display:flex;flex-direction:column}
.editor-topbar{background:var(--navy);color:var(--white);padding:10px 20px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.editor-topbar h3{font-size:.9rem;font-weight:600;margin:0}
.editor-container{flex:1;width:100%;height:100%}
/* ── Explorer row hover ── */
.files-table tbody tr{transition:background .15s}
.files-table tbody tr:hover{background:var(--gray-50)}
.files-table .folder-row{cursor:pointer}
.files-table .folder-row:hover{background:rgba(26,106,192,0.04)!important}
.files-table .separator-row td{padding:6px 16px!important;background:var(--gray-50)}
/* ── Compact action buttons on small screens ── */
@media(max-width:900px){
  .files-table td:last-child .btn{padding:5px 10px;font-size:.72rem}
  .files-table td:last-child .btn svg{display:none}
}

@media(max-width:768px){
  .content{padding:16px}
  .stats{grid-template-columns:1fr 1fr}
  .folders{grid-template-columns:1fr}
  .nav-tabs{width:100%;overflow-x:auto}
  .topbar{padding:0 16px}
  .modal{padding:24px}
  .files-table{font-size:.8rem}
  .files-table th,.files-table td{padding:8px 10px}
}
</style>
</head>

// ─── Utility ───
function api(path, opts = {}) {
  const token = localStorage.getItem('dp_token');
  return fetch(`${API}${path}`, {
    ...opts,
    headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: `Bearer ${token}` } : {}), ...opts.headers },
  }).then(async r => {
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || 'Errore');
    return data;
  });
}

function apiUpload(path, formData) {
  const token = localStorage.getItem('dp_token');
  return fetch(`${API}${path}`, {
    method: 'POST',
    headers: { ...(token ? { Authorization: `Bearer ${token}` } : {}) },
    body: formData,
  }).then(async r => {
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || 'Errore upload');
    return data;
  });
}

function timeAgo(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = Math.floor((now - d) / 1000);
  if (diff < 60) return 'ora';
  if (diff < 3600) return Math.floor(diff/60) + ' min fa';
  if (diff < 86400) return Math.floor(diff/3600) + ' ore fa';
  return d.toLocaleDateString('it-IT', { day:'2-digit', month:'short' });
}

function fileExt(name) {
  return (name.match(/\.(\w+)$/)||[,''])[1].toLowerCase();
}

function extClass(ext) {
  if (['pdf'].includes(ext)) return 'ext-pdf';
  if (['doc','docx','odt','rtf'].includes(ext)) return 'ext-doc';
  if (['xls','xlsx','csv'].includes(ext)) return 'ext-xls';
  if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return 'ext-img';
  return 'ext-other';
}

function formatSize(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
  return (bytes/1048576).toFixed(1) + ' MB';
}



function isEditableOnline(ext) {
  return ['doc','docx','xls','xlsx','ppt','pptx','odt','ods','odp'].includes(ext);
}

function isFileOwner(file, user) {
  if (!file.caricatoDa) return false;
  const ownerId = typeof file.caricatoDa === 'object' ? file.caricatoDa._id : file.caricatoDa;
  return ownerId === user.id;
}

// ─── Folder View (Windows Explorer style) ───
function FolderView({ folderId, user, onNav }) {
  const [folder, setFolder] = useState(null);
  const [files, setFiles] = useState([]);
  const [subfolders, setSubfolders] = useState([]);
  const [breadcrumb, setBreadcrumb] = useState([]);
  const [uploading, setUploading] = useState(false);
  const [showVersions, setShowVersions] = useState(null);
  const [showNewSubfolder, setShowNewSubfolder] = useState(false);
  const fileInput = useRef(null);
  const [editingFile, setEditingFile] = useState(null);

  const load = useCallback(() => {
    api(`/folders/${folderId}`).then(r => {
      setFolder(r.data.folder);
      setSubfolders(r.data.subfolders || []);
      setBreadcrumb(r.data.breadcrumb || []);
    }).catch(()=>{});
    api(`/files?folder=${folderId}`).then(r => setFiles(r.data)).catch(()=>{});
  }, [folderId]);

  useEffect(() => { load(); }, [load]);

  async function handleUpload(e) {
    const file = e.target.files[0];
    if (!file) return;
    setUploading(true);
    const fd = new FormData();
    fd.append('file', file);
    fd.append('folder', folderId);
    try { await apiUpload('/files/upload', fd); load(); }
    catch (err) { alert(err.message); }
    setUploading(false);
    e.target.value = '';
  }

  async function handleNewVersion(fileId) {
    const input = document.createElement('input');
    input.type = 'file';
    input.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      setUploading(true);
      const fd = new FormData();
      fd.append('file', file);
      fd.append('folder', folderId);
      fd.append('fileId', fileId);
      try { await apiUpload('/files/upload', fd); load(); }
      catch (err) { alert(err.message); }
      setUploading(false);
    };
    input.click();
  }

  async function handleDownload(fileId, nome, versione) {
    try {
      const url = versione ? `/files/${fileId}/download?versione=${versione}` : `/files/${fileId}/download`;
      const res = await api(url);
      window.open(res.url, '_blank');
    } catch (err) { alert(err.message); }
  }

  async function handleDelete(fileId) {
    if (!confirm('Eliminare questo file?')) return;
    try { await api(`/files/${fileId}`, { method: 'DELETE' }); load(); }
    catch (err) { alert(err.message); }
  }

  async function handleDeleteFolder(sf) {
    if (!confirm(`Eliminare la cartella "${sf.nome}"? Deve essere vuota.`)) return;
    try { await api(`/folders/${sf._id}`, { method: 'DELETE' }); load(); }
    catch (err) { alert(err.message); }
  }


  async function handleEditOnline(fileId) {
    try {
      const res = await api(`/files/${fileId}/editor-config`);
      setEditingFile({ fileId, config: res.config, editorUrl: res.editorUrl });
    } catch (err) {
      alert(err.message);
    }
  }

  function handleCloseEditor() {
    setEditingFile(null);
    // Wait for OnlyOffice callback to save the file before refreshing
    setTimeout(() => {
      load();
      setTimeout(() => load(), 5000); // refresh again after 5s to catch late saves
    }, 3000);
  }

  if (!folder) return <div className="empty"><p>Caricamento...</p></div>;

  const totalItems = subfolders.length + files.length;
  const isAdmin = user.ruolo === 'superadmin';

  return (
    <div>

      </div>

                      <span style={{fontWeight:500,color:'var(--gray-800)'}}>{sf.nome}</span>
                    </div>
                  </td>
                  <td style={{fontSize:'.82rem',color:'var(--gray-400)'}}>Cartella</td>
                  <td style={{fontSize:'.82rem',color:'var(--gray-400)'}}>—</td>
                  <td style={{fontSize:'.82rem',color:'var(--gray-400)'}}>{timeAgo(sf.updatedAt)}</td>
                  <td onClick={e=>e.stopPropagation()}>
                    {(isAdmin || (sf.creadoDa && sf.creadoDa.toString() === user.id)) && (
                      <button className="btn btn-ghost btn-sm" onClick={()=>handleDeleteFolder(sf)} title="Elimina cartella" style={{padding:'6px 10px'}}>
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--gray-400)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>

      {/* Modals */}
      {editingFile && <OnlyOfficeEditor config={editingFile.config} editorUrl={editingFile.editorUrl} onClose={handleCloseEditor} />}
      {showNewSubfolder && (
        <div className="modal-overlay" onClick={()=>setShowNewSubfolder(false)}>
          <form className="modal" onClick={e=>e.stopPropagation()} onSubmit={async (e)=>{
            e.preventDefault();
            const nome = e.target.elements.subname.value.trim();
            if (!nome) return;
            try { await api('/folders', { method:'POST', body:JSON.stringify({ nome, parent:folderId }) }); setShowNewSubfolder(false); load(); }
            catch(err) { alert(err.message); }
          }}>
            <h3>Nuova cartella in "{folder.nome}"</h3>
            <div className="modal-field"><label>Nome cartella</label><input name="subname" required autoFocus placeholder="es. Bilanci, Bandi, Corrispondenza..." /></div>
            <div className="modal-actions">
              <button type="button" className="btn btn-ghost" onClick={()=>setShowNewSubfolder(false)}>Annulla</button>
              <button type="submit" className="btn btn-primary">Crea cartella</button>
            </div>
          </form>
        </div>
      )}
      {showVersions && <VersionHistory fileId={showVersions._id} fileName={showVersions.nome} onClose={()=>setShowVersions(null)} onDownload={handleDownload} />}
    </div>
  );
}

// ─── Users management ───
function UsersView({ onNav }) {
  const [users, setUsers] = useState([]);
  const [showModal, setShowModal] = useState(false);
  const [form, setForm] = useState({ nome:'', email:'', ruolo:'collaboratore' });
  const [error, setError] = useState('');

  useEffect(() => { api('/auth/users').then(r => setUsers(r.data)).catch(()=>{}); }, []);

  async function createUser(e) {
    e.preventDefault(); setError('');
    try {
      await api('/auth/users', { method: 'POST', body: JSON.stringify(form) });
      setShowModal(false);
      setForm({ nome:'', email:'', ruolo:'collaboratore' });
      api('/auth/users').then(r => setUsers(r.data));
    } catch (err) { setError(err.message); }
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{fontSize:'1.1rem',fontWeight:700,color:'var(--navy)'}}>Utenti</h2>
        <button className="btn btn-primary btn-sm" onClick={()=>setShowModal(true)}>+ Nuovo utente</button>
      </div>
      <div className="card">
        <table className="files-table">
          <thead><tr><th>Nome</th><th>Email</th><th>Ruolo</th><th>Stato</th><th>Ultimo accesso</th></tr></thead>
          <tbody>
            {users.map(u => (
              <tr key={u._id}>
                <td style={{fontWeight:500,color:'var(--navy)'}}>{u.nome}</td>
                <td>{u.email}</td>
                <td><span className={"badge "+(u.ruolo==='superadmin'?'badge-amber':u.ruolo==='collaboratore'?'badge-blue':'badge-green')}>{u.ruolo}</span></td>
                <td><span className={"badge "+(u.attivo?'badge-green':'badge-red')}>{u.attivo?'Attivo':'Disattivato'}</span></td>
                <td style={{fontSize:'.82rem',color:'var(--gray-400)'}}>{u.ultimoAccesso ? timeAgo(u.ultimoAccesso) : 'Mai'}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      {showModal && (
        <div className="modal-overlay" onClick={()=>setShowModal(false)}>
          <form className="modal" onClick={e=>e.stopPropagation()} onSubmit={createUser}>
            <h3>Nuovo utente</h3>
            <div className="modal-field"><label>Nome</label><input value={form.nome} onChange={e=>setForm({...form,nome:e.target.value})} required /></div>
            <div className="modal-field"><label>Email</label><input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} required /></div>
            
            <div className="modal-field"><label>Ruolo</label><select value={form.ruolo} onChange={e=>setForm({...form,ruolo:e.target.value})}><option value="collaboratore">Collaboratore</option><option value="cliente">Cliente</option></select></div>
            {error && <p style={{color:'var(--red)',fontSize:'.82rem'}}>{error}</p>}
            <div className="modal-actions">
              <button type="button" className="btn btn-ghost" onClick={()=>setShowModal(false)}>Annulla</button>
              <button type="submit" className="btn btn-primary">Crea utente</button>
            </div>
          </form>
        </div>
      )}
    </div>
  );
}

// ─── New Folder Modal ───
function NewFolderModal({ onClose, onCreated }) {
  const [nome, setNome] = useState('');
  const [desc, setDesc] = useState('');
  const [error, setError] = useState('');

  async function handleSubmit(e) {
    e.preventDefault(); setError('');
    try {
      await api('/folders', { method: 'POST', body: JSON.stringify({ nome, descrizione: desc }) });
      onCreated();
      onClose();
    } catch (err) { setError(err.message); }
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <form className="modal" onClick={e=>e.stopPropagation()} onSubmit={handleSubmit}>
        <h3>Nuova cartella</h3>
        <div className="modal-field"><label>Nome</label><input value={nome} onChange={e=>setNome(e.target.value)} required autoFocus /></div>
        <div className="modal-field"><label>Descrizione (opzionale)</label><input value={desc} onChange={e=>setDesc(e.target.value)} /></div>
        {error && <p style={{color:'var(--red)',fontSize:'.82rem'}}>{error}</p>}
        <div className="modal-actions">
          <button type="button" className="btn btn-ghost" onClick={onClose}>Annulla</button>
          <button type="submit" className="btn btn-primary">Crea</button>
        </div>
      </form>
    </div>
  );
}

// ─── Notifications ───
function NotificheView() {
  const [notifiche, setNotifiche] = useState([]);

  useEffect(() => { api('/notifiche?limit=50').then(r => setNotifiche(r.data)).catch(()=>{}); }, []);

  async function markRead(id) {
    await api(`/notifiche/${id}/letto`, { method: 'PATCH' }).catch(()=>{});
    setNotifiche(ns => ns.map(n => n._id === id ? {...n, letto: true} : n));
  }

  async function markAll() {
    await api('/notifiche/leggi-tutte', { method: 'PATCH' }).catch(()=>{});
    setNotifiche(ns => ns.map(n => ({...n, letto: true})));
  }

  return (
    <div>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:16}}>
        <h2 style={{fontSize:'1.1rem',fontWeight:700,color:'var(--navy)'}}>Notifiche</h2>
        <button className="btn btn-ghost btn-sm" onClick={markAll}>Segna tutte lette</button>
      </div>
      <div className="card">
        {notifiche.length === 0 ? (
          <div className="empty"><div className="icon">🔔</div><p>Nessuna notifica</p></div>
        ) : notifiche.map(n => (
          <div key={n._id} className={"notif-item"+(n.letto?'':' unread')} onClick={()=>!n.letto && markRead(n._id)} style={{cursor:n.letto?'default':'pointer'}}>
            <div className={"notif-dot"+(n.letto?' read':'')}></div>
            <div className="notif-text">{n.messaggio}</div>
            <div className="notif-time">{timeAgo(n.createdAt)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ─── Permissions ───
function PermissionsView({ folderId, onClose }) {
  const [perms, setPerms] = useState([]);
  const [users, setUsers] = useState([]);
  const [selUser, setSelUser] = useState('');
  const [opts, setOpts] = useState({ leggere:true, scrivere:false, eliminare:false });

  useEffect(() => {
    api(`/folders/${folderId}/permessi`).then(r => setPerms(r.data)).catch(()=>{});
    api('/auth/users').then(r => setUsers(r.data.filter(u=>u.ruolo!=='superadmin'))).catch(()=>{});
  }, [folderId]);

  async function addPerm(e) {
    e.preventDefault();
    if (!selUser) return;
    try {
      await api(`/folders/${folderId}/permessi`, { method:'POST', body:JSON.stringify({ utente:selUser, ...opts }) });
      api(`/folders/${folderId}/permessi`).then(r => setPerms(r.data));
      setSelUser('');
    } catch (err) { alert(err.message); }
  }

  async function removePerm(userId) {
    await api(`/folders/${folderId}/permessi/${userId}`, { method:'DELETE' }).catch(()=>{});
    setPerms(ps => ps.filter(p => (p.utente._id||p.utente) !== userId));
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:560}}>
        <h3>Gestione permessi</h3>
        <table className="files-table" style={{marginBottom:20}}>
          <thead><tr><th>Utente</th><th>Leggere</th><th>Scrivere</th><th>Eliminare</th><th></th></tr></thead>
          <tbody>
            {perms.map(p => (
              <tr key={p._id}>
                <td style={{fontWeight:500}}>{p.utente?.nome||'—'}</td>
                <td>{p.permessi?.leggere ? '✓' : '—'}</td>
                <td>{p.permessi?.scrivere ? '✓' : '—'}</td>
                <td>{p.permessi?.eliminare ? '✓' : '—'}</td>
                <td><button className="btn btn-sm" style={{color:'var(--red)',background:'none',border:'none'}} onClick={()=>removePerm(p.utente?._id||p.utente)}>✕</button></td>
              </tr>
            ))}
            {perms.length===0 && <tr><td colSpan={5} style={{textAlign:'center',color:'var(--gray-400)',padding:20}}>Nessun permesso assegnato</td></tr>}
          </tbody>
        </table>
        <form onSubmit={addPerm} style={{display:'flex',gap:8,alignItems:'flex-end',flexWrap:'wrap'}}>
          <div style={{flex:1,minWidth:150}}>
            <label style={{display:'block',fontSize:'.72rem',fontWeight:600,color:'var(--gray-400)',marginBottom:4}}>UTENTE</label>
            <select value={selUser} onChange={e=>setSelUser(e.target.value)} style={{width:'100%',padding:'8px 10px',border:'1px solid var(--gray-200)',borderRadius:8,fontSize:'.85rem'}}>
              <option value="">Seleziona...</option>
              {users.map(u=><option key={u._id} value={u._id}>{u.nome} ({u.ruolo})</option>)}
            </select>
          </div>
          <label style={{fontSize:'.78rem',display:'flex',alignItems:'center',gap:4}}><input type="checkbox" checked={opts.leggere} onChange={e=>setOpts({...opts,leggere:e.target.checked})} /> Leggere</label>
          <label style={{fontSize:'.78rem',display:'flex',alignItems:'center',gap:4}}><input type="checkbox" checked={opts.scrivere} onChange={e=>setOpts({...opts,scrivere:e.target.checked})} /> Scrivere</label>
          <label style={{fontSize:'.78rem',display:'flex',alignItems:'center',gap:4}}><input type="checkbox" checked={opts.eliminare} onChange={e=>setOpts({...opts,eliminare:e.target.checked})} /> Eliminare</label>
          <button type="submit" className="btn btn-primary btn-sm">Assegna</button>
        </form>
        <div className="modal-actions" style={{marginTop:20}}><button className="btn btn-ghost" onClick={onClose}>Chiudi</button></div>
      </div>
    </div>
  );
}


// ─── Version History Modal ───
function VersionHistory({ fileId, fileName, onClose, onDownload }) {
  const [versions, setVersions] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api(`/files/${fileId}/versioni`).then(r => {
      setVersions(r.data);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, [fileId]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()} style={{maxWidth:600}}>
        <h3>Storico versioni — {fileName}</h3>
        {loading ? <p style={{color:'var(--gray-400)'}}>Caricamento...</p> : (
          <table className="files-table" style={{marginTop:12}}>
            <thead><tr><th>Versione</th><th>Caricato da</th><th>Data</th><th>Dimensione</th><th></th></tr></thead>
            <tbody>
              {versions.map(v => (
                <tr key={v._id}>
                  <td><span className="badge badge-blue">v{v.numero}</span></td>
                  <td style={{fontWeight:500,color:'var(--navy)'}}>{v.caricatoDa?.nome || '—'}</td>
                  <td style={{fontSize:'.82rem',color:'var(--gray-400)'}}>{new Date(v.createdAt).toLocaleString('it-IT',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
                  <td style={{fontSize:'.82rem',color:'var(--gray-400)'}}>{formatSize(v.dimensione)}</td>
                  <td><button className="btn btn-primary btn-sm" onClick={()=>onDownload(fileId, fileName, v.numero)} title="Scarica il file">Scarica documentazione</button></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
        <div className="modal-actions" style={{marginTop:20}}><button className="btn btn-ghost" onClick={onClose}>Chiudi</button></div>
      </div>
    </div>
  );
}


// ─── OnlyOffice Editor ───
function OnlyOfficeEditor({ config, editorUrl, onClose }) {
  const containerRef = useRef(null);
  const editorRef = useRef(null);
  const [loaded, setLoaded] = useState(false);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    // Load OnlyOffice JS API
    if (window.DocsAPI) { setLoaded(true); return; }
    const script = document.createElement('script');
    script.src = `${editorUrl}/web-apps/apps/api/documents/api.js`;
    script.onload = () => setLoaded(true);
    script.onerror = () => alert('Impossibile caricare l\'editor. Verifica la connessione.');
    document.head.appendChild(script);
  }, [editorUrl]);

  useEffect(() => {
    if (!loaded || !containerRef.current || editorRef.current) return;
    try {
      const editorConfig = {
        ...config,
        events: {
          onDocumentReady: () => console.log('[OnlyOffice] Documento pronto'),
          onError: (e) => console.error('[OnlyOffice] Errore:', e),
          onDocumentStateChange: (e) => {
            // e.data = true means document was modified
            if (e.data) console.log('[OnlyOffice] Documento modificato');
          },
        },
      };
      editorRef.current = new DocsAPI.DocEditor('onlyoffice-editor', editorConfig);
    } catch(e) {
      console.error('Editor init error:', e);
      alert('Errore apertura editor: ' + e.message);
    }
  }, [loaded, config]);

  function handleClose() {
    setSaving(true);
    if (editorRef.current) {
      try { editorRef.current.destroyEditor(); } catch(e) {}
      editorRef.current = null;
    }
    // Wait for OnlyOffice to send the callback before closing
    setTimeout(() => {
      setSaving(false);
      onClose();
    }, 4000);
  }

  return (
    <div className="editor-overlay">
      <div className="editor-topbar">
        <h3>{config.document?.title || 'Documento'}</h3>
        <button className="topbar-btn" onClick={handleClose} disabled={saving}>
          {saving ? 'Salvataggio in corso...' : '✕ Chiudi e salva'}
        </button>
      </div>
      <div className="editor-container">
        <div id="onlyoffice-editor" ref={containerRef} style={{width:'100%',height:'100%'}}></div>
      </div>
    </div>
  );
}

// ─── Main App ───
function App() {
  const [user, setUser] = useState(null);
  const [view, setView] = useState('dashboard');
  const [authView, setAuthView] = useState('login'); // login, forgot, setup, reset
  const [authToken, setAuthToken] = useState(null);

  // Parse hash for invite/reset tokens
  useEffect(() => {
    const hash = window.location.hash;
    if (hash.includes('setup?token=')) {
      const token = hash.split('token=')[1];
      setAuthToken(token);
      setAuthView('setup');
    } else if (hash.includes('reset?token=')) {
      const token = hash.split('token=')[1];
      setAuthToken(token);
      setAuthView('reset');
    }
  }, []);
  const [viewId, setViewId] = useState(null);
  const [notifCount, setNotifCount] = useState(0);
  const [showPerms, setShowPerms] = useState(null);
  const [showNewFolder, setShowNewFolder] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);

  useEffect(() => {
    const saved = localStorage.getItem('dp_user');
    const token = localStorage.getItem('dp_token');
    if (saved && token) {
      setUser(JSON.parse(saved));
      loadNotifCount();
    }
  }, []);

  function loadNotifCount() {
    api('/notifiche?letto=false&limit=1').then(r => setNotifCount(r.nonLette||0)).catch(()=>{});
  }

  useEffect(() => {
    if (!user) return;
    const iv = setInterval(loadNotifCount, 30000);
    return () => clearInterval(iv);
  }, [user]);

  function navigate(target, id) {
    if (target === 'new-folder') { setShowNewFolder(true); return; }
    if (target === 'permissions') { setShowPerms(id); return; }
    setView(target);
    setViewId(id || null);
    window.scrollTo(0, 0);
  }

  function handleLogout() {
    localStorage.removeItem('dp_token');
    localStorage.removeItem('dp_user');
    setUser(null);
    setView('dashboard');
  }

  if (!user) {
    if (authView === 'setup' && authToken) return <SetupPasswordScreen token={authToken} onDone={()=>{setAuthView('login');setAuthToken(null);window.location.hash='';}} />;
    if (authView === 'reset' && authToken) return <ResetPasswordScreen token={authToken} onDone={()=>{setAuthView('login');setAuthToken(null);window.location.hash='';}} />;
    if (authView === 'forgot') return <ForgotPasswordScreen onBack={()=>setAuthView('login')} />;
    return <LoginScreen onLogin={u => { setUser(u); loadNotifCount(); }} onForgot={()=>setAuthView('forgot')} />;
  }

  const isAdmin = user.ruolo === 'superadmin';

  return (
    <div>
      <Topbar user={user} notifCount={notifCount} onLogout={handleLogout} onNav={navigate} current={view} />
      <div className="content">
        <div className="nav-tabs">
          <button className={"nav-tab"+(view==='dashboard'?' active':'')} onClick={()=>navigate('dashboard')}>Dashboard</button>
          {isAdmin && <button className={"nav-tab"+(view==='users'?' active':'')} onClick={()=>navigate('users')}>Utenti</button>}
          <button className={"nav-tab"+(view==='notifiche'?' active':'')} onClick={()=>navigate('notifiche')}>Notifiche{notifCount>0 && <span className="notif-badge" style={{marginLeft:6}}>{notifCount}</span>}</button>
        </div>

        {view === 'dashboard' && <Dashboard key={refreshKey} user={user} onNav={navigate} />}
        {view === 'folder' && viewId && <FolderView folderId={viewId} user={user} onNav={navigate} />}
        {view === 'users' && isAdmin && <UsersView onNav={navigate} />}
        {view === 'notifiche' && <NotificheView />}
      </div>

      {showNewFolder && <NewFolderModal onClose={()=>setShowNewFolder(false)} onCreated={()=>{setRefreshKey(k=>k+1);navigate('dashboard')}} />}
      {showPerms && <PermissionsView folderId={showPerms} onClose={()=>setShowPerms(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
